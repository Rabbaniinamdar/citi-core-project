server:
  port: 8082

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://mysql:3306/citicore_userdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  kafka:
    bootstrap-servers: kafka:9092

    consumer:
      group-id: user-group

# ============================================================
# AWS
# ============================================================

aws:
  region: ${AWS_REGION:ap-south-1}

  s3:
    bucket: ${S3_BUCKET:citicore-kyc-docs}

# ============================================================
# LOCAL KYC STORAGE
# ============================================================

kyc:
  upload-dir: /app/uploads/kyc/

logging:
  level:
    com.citicore.user: DEBUG