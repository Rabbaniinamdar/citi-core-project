services:

  # ==========================================================
  # MYSQL
  # ==========================================================
  mysql:
    image: mysql:8.0
    container_name: citicore-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-root}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - citicore-network


  # ==========================================================
  # REDIS
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: citicore-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - citicore-network


  # ==========================================================
  # KAFKA
  # ==========================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: citicore-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - citicore-network

    restart: unless-stopped


  # ==========================================================
  # EUREKA SERVER
  # ==========================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    container_name: citicore-eureka-server

    ports:
      - "8761:8761"

    environment:
      SERVER_PORT: 8761

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - citicore-network


  # ==========================================================
  # CONFIG SERVER
  # ==========================================================
  config-server:
    build:
      context: ./config-service
      dockerfile: Dockerfile

    container_name: citicore-config-server

    ports:
      - "8888:8888"

    environment:
      SERVER_PORT: 8888

      # Use LOCAL config repository instead of AWS/Git
      SPRING_PROFILES_ACTIVE: native

      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

      # Spring Cloud Bus Kafka
      KAFKA_BROKERS: kafka:9092

      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092

    volumes:
      - ./config-repo-local:/config-repo:ro

    depends_on:
      kafka:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - citicore-network


  # ==========================================================
  # AUTH SERVICE
  # ==========================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile

    container_name: citicore-auth-service

    ports:
      - "8081:8081"

    environment:
      SERVER_PORT: 8081

      SPRING_APPLICATION_NAME: auth-service

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      AUTH_DB_HOST: mysql

      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: ${JWT_SECRET}

      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

    depends_on:
      mysql:
        condition: service_healthy

      kafka:
        condition: service_healthy

      config-server:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

    networks:
      - citicore-network


  # ==========================================================
  # USER SERVICE
  # ==========================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile

    container_name: citicore-user-service

    ports:
      - "8082:8082"

    environment:
      SERVER_PORT: 8082

      SPRING_APPLICATION_NAME: user-service

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      AUTH_DB_HOST: mysql

      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-citicore-kyc-docs}
      JWT_SECRET: ${JWT_SECRET}

    volumes:
      - ./uploads/kyc:/app/uploads/kyc

    depends_on:
      mysql:
        condition: service_healthy

      kafka:
        condition: service_healthy

      config-server:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

    networks:
      - citicore-network


  # ==========================================================
  # ACCOUNT SERVICE
  # ==========================================================
  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile.local

    container_name: citicore-account-service

    ports:
      - "8083:8083"

    environment:
      SERVER_PORT: 8083

      SPRING_APPLICATION_NAME: account-service

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      kafka:
        condition: service_healthy

      config-server:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

    networks:
      - citicore-network


  # ==========================================================
  # TRANSACTION SERVICE
  # ==========================================================
  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile

    container_name: citicore-transaction-service

    ports:
      - "8084:8084"

    environment:
      SERVER_PORT: 8084

      SPRING_APPLICATION_NAME: transaction-service

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      TRANSACTION_DB_HOST: mysql

      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

      kafka:
        condition: service_healthy

      config-server:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

    networks:
      - citicore-network


  # ==========================================================
  # NOTIFICATION SERVICE
  # ==========================================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    container_name: citicore-notification-service

    ports:
      - "8085:8085"

    environment:
      SERVER_PORT: 8085

      SPRING_APPLICATION_NAME: notification-service

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      kafka:
        condition: service_healthy

      config-server:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

    networks:
      - citicore-network


  # ==========================================================
  # API GATEWAY
  # ==========================================================
  api-gateway:
    build:
      context: ./apigateway-service
      dockerfile: Dockerfile

    container_name: citicore-api-gateway

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080

      SPRING_APPLICATION_NAME: apigateway-service

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      redis:
        condition: service_healthy

      config-server:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

      auth-service:
        condition: service_started

      user-service:
        condition: service_started

      account-service:
        condition: service_started

      transaction-service:
        condition: service_started

      notification-service:
        condition: service_started

    networks:
      - citicore-network


# ============================================================
# VOLUMES
# ============================================================
volumes:

  mysql_data:
    name: citicore-mysql-data

  redis_data:
    name: citicore-redis-data

  kafka_data:
    name: citicore-kafka-data


# ============================================================
# NETWORK
# ============================================================
networks:

  citicore-network:
    name: citicore-network
    driver: bridge