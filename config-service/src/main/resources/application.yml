server:
  port: 8888
  shutdown: graceful

spring:
  application:
    name: config-server

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,busrefresh
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    enable:
      all: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    org.springframework.cloud.config: INFO
    org.springframework.cloud.bus: INFO
    com.citicore.gateway: INFO