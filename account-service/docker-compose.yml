version: '3.8'

# ─────────────────────────────────────────────────────────────
# CitiCore — MySQL Primary + Replica + Supporting Services
#
# Ports:
#   MySQL Primary  → localhost:3306
#   MySQL Replica  → localhost:3307
#   Redis          → localhost:6379
#   Kafka          → localhost:9092
#   Zookeeper      → localhost:2181
#
# Start order:
#   1. mysql-primary  (primary DB)
#   2. mysql-replica  (depends on primary being healthy)
#   3. redis, zookeeper, kafka
#   4. Your Spring Boot services
#
# Run:
#   docker-compose up -d
#   docker-compose logs -f mysql-replica   ← watch replication start
# ─────────────────────────────────────────────────────────────

services:

  mysql-primary:
    build:
      context: ./mysql-config
      dockerfile: Dockerfile.primary
    container_name: citicore-mysql-primary
    restart: unless-stopped
    ports:
      - "3308:3306"        # host:container — 3308 on your machine
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: citicore_account
      MYSQL_USER: citicore
      MYSQL_PASSWORD: citicore123
    volumes:
      - mysql-primary-data:/var/lib/mysql
    networks:
      - citicore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "citicore", "-pciticore123"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  mysql-replica:
    build:
      context: ./mysql-config
      dockerfile: Dockerfile.replica
    container_name: citicore-mysql-replica
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: citicore_account
      MYSQL_USER: citicore_readonly
      MYSQL_PASSWORD: replica123
    volumes:
      - mysql-replica-data:/var/lib/mysql
    networks:
      - citicore-net
    depends_on:
      mysql-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "citicore_readonly", "-preplica123"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: citicore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - citicore-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: citicore-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - citicore-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: citicore-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # ✅ TWO listeners:
      #   PLAINTEXT_HOST → Spring Boot apps on your machine (localhost:9092)
      #   PLAINTEXT      → inter-container comms (kafka:29092)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - citicore-net
    depends_on:
      - zookeeper

volumes:
  mysql-primary-data:
  mysql-replica-data:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:

networks:
  citicore-net:
    driver: bridge